<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spish &amp; Ollie’s Memory Map</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Memory Map">
<meta name="theme-color" content="#f6ede4">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="places.js"></script>
<style>
/* Layout: one-screen app — header, a full-bleed map or scrolling view, bottom tab bar. Scrapbook warmth from their own mockups. */
:root{
  --bg:#f6ede4; --surface:#fffaf5; --sunk:#efe3d8; --ink:#2b1b1d; --muted:#7c6567; --line:#e3d2c6;
  --accent:#c7323e; --accent-soft:#f6d9d6; --on-accent:#fff;
  --sea:#d9e6e8; --land:#f4e9dc; --coast:#cdb7a2; --route:#c7323e;
  --shadow:0 6px 24px rgba(70,30,30,.12);
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1315; --surface:#271b1e; --sunk:#32252a; --ink:#f5e9e3; --muted:#b9a19f; --line:#433236;
  --accent:#f0646f; --accent-soft:#4a2328; --on-accent:#1c1315;
  --sea:#17242b; --land:#2c2224; --coast:#4c3a3b; --route:#f0646f; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1315; --surface:#271b1e; --sunk:#32252a; --ink:#f5e9e3; --muted:#b9a19f; --line:#433236;
  --accent:#f0646f; --accent-soft:#4a2328; --on-accent:#1c1315;
  --sea:#17242b; --land:#2c2224; --coast:#4c3a3b; --route:#f0646f; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;position:relative;padding-top:env(safe-area-inset-top,0px)}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px 8px}
.couple{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.couple .h{color:var(--accent);font-size:.8em;margin:0 .15em}
.since{font-size:12.5px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.me-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--muted)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view[hidden]{display:none!important}
.pad{padding:4px 16px 110px}
nav.tabs{display:flex;align-items:center;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 8px;min-width:56px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs .add{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--on-accent);justify-content:center;min-width:0;padding:0;box-shadow:var(--shadow);margin-top:-14px}
nav.tabs .add svg{width:24px;height:24px}

/* map */
.map{position:absolute;inset:0;overflow:hidden;background:var(--sea);z-index:0}
.leaflet-container{font-family:var(--f-body);background:var(--sea)}
.leaflet-control-attribution{font-size:10px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.pin{position:relative;width:46px;height:54px;display:block;cursor:pointer}
.pin .b{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);box-shadow:var(--shadow);overflow:hidden;display:grid;place-items:center;color:var(--accent)}
.pin .b img{width:100%;height:100%;object-fit:cover;display:block}
.pin .t{position:absolute;left:17px;top:40px;width:12px;height:12px;background:var(--accent);transform:rotate(45deg);border-radius:2px}
.pin .n{position:absolute;right:-6px;top:-6px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;border-radius:999px;min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center}
.map-float{position:absolute;left:12px;right:12px;display:flex;justify-content:center;pointer-events:none;z-index:2}
.map-float > *{pointer-events:auto}
.map-float.topf{top:10px}
.map-float.bot{bottom:14px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.pill b{font-variant-numeric:tabular-nums}
.otd{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:10px;align-items:center;max-width:420px;width:100%;border:1px solid var(--line);text-align:left}
.otd img,.otd .ph{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--accent-soft)}
.otd small{display:block;color:var(--accent);font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.zoomctl{position:absolute;z-index:2;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center}

/* generic */
h2.sec{font-family:var(--f-display);font-weight:600;font-size:22px;margin:14px 0 8px;letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.muted{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.danger{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.notice{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:6px 0 10px}

/* timeline */
.tl{position:relative;padding-left:0}
.tl-year{font-family:var(--f-display);font-size:28px;font-weight:600;color:var(--muted);margin:18px 0 6px 64px}
.tl-item{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:8px 0;position:relative;width:100%;background:none;border:0;text-align:left}
.tl-item::before{content:"";position:absolute;left:25px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-dot{width:52px;height:52px;border-radius:50%;border:3px solid var(--accent);background:var(--surface);overflow:hidden;display:grid;place-items:center;position:relative;z-index:1;color:var(--accent)}
.tl-dot img{width:100%;height:100%;object-fit:cover}
.tl-dot.ms{background:var(--accent);color:var(--on-accent)}
.tl-body{min-width:0}
.tl-title{font-weight:600;font-size:15.5px}
.tl-meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-tags{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
.tag{font-size:11.5px;background:var(--sunk);border-radius:999px;padding:1px 8px;color:var(--muted);font-variant-numeric:tabular-nums}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{padding:12px 8px;text-align:center}
.tile b{display:block;font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.bars{display:grid;gap:8px;padding:12px 14px}
.bar{display:grid;grid-template-columns:80px 1fr 64px;gap:10px;align-items:center;font-size:13.5px}
.bar .tr{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.fav{overflow:hidden;position:relative;min-height:120px;display:flex;align-items:flex-end;background:var(--accent-soft);border:0;width:100%;padding:0;text-align:left}
.fav img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fav .ov{position:relative;padding:14px;width:100%;background:linear-gradient(transparent,rgba(20,8,10,.7));color:#fff}
.fav .ov small{opacity:.85;font-size:12px}
.fav .ov div{font-family:var(--f-display);font-size:22px;font-weight:600}

/* journeys */
.leg{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.leg:last-child{border-bottom:0}
.leg .ic{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:16px}
.leg .mi{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.leg .mi small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.bigmiles{font-family:var(--f-display);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}

/* sheets / pages */
.page{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
.page-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.page-head h3{flex:1;margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.page-body{flex:1;overflow-y:auto;padding:12px 16px 40px}
.page-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px}
.page-foot .btn{flex:1}

/* form */
.f{display:grid;gap:6px;margin-bottom:16px}
.f > label,.lab{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-width:0}
textarea.inp{min-height:84px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > *{min-width:0}
.pf{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
.sugg button:last-child{border-bottom:0}
.sugg button small{color:var(--muted);margin-left:6px}
.sugg button.act{color:var(--accent);font-weight:600}
.placed{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px 9px 12px}
.placed .grow{flex:1;min-width:0}
.placed small{display:block;color:var(--muted);font-size:12px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumbs .th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sunk);max-width:100%}
.thumbs .th img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.play span{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:14px;padding-left:3px}
.gallery button{position:relative}
.lb video{max-width:100%;max-height:100%}
.thumbs .th button{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.thumbs label.addph{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;cursor:pointer}
.rate{display:grid;grid-template-columns:1fr 64px;gap:12px;align-items:center}
.rate input{width:100%;accent-color:var(--accent)}
.rate output{font-family:var(--f-display);font-size:28px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.rate output small{font-size:14px;color:var(--muted)}
.dish{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:grid;gap:8px;margin-bottom:8px}
.dish .top{display:flex;gap:8px;align-items:center}
.dish .top .inp{flex:1}
.dishlist .row2{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.dishlist .row2:last-child{border-bottom:0}
.score{font-family:var(--f-display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;text-align:right}
.score small{font-size:12px;color:var(--muted);font-family:var(--f-body);font-weight:400}
.legform{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:grid;gap:10px;margin-bottom:10px}
.legform .hd{display:flex;align-items:center;justify-content:space-between;font-weight:600}
.legform .mrow{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted)}
.legform .mrow input{width:90px}

/* detail */
.hero{position:relative;aspect-ratio:4/3;background:var(--accent-soft);max-width:none;overflow:hidden;margin:-12px -16px 0;width:calc(100% + 32px)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .nophoto{position:absolute;inset:0;display:grid;place-items:center;color:var(--accent);opacity:.6}
.d-title{font-family:var(--f-display);font-size:28px;font-weight:600;margin:14px 0 2px;line-height:1.15;text-wrap:balance}
.d-meta{color:var(--muted);font-size:14px}
.d-story{margin:12px 0;max-width:65ch;white-space:pre-wrap}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.facts > div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.facts small{display:block;color:var(--muted);font-size:11.5px}
.facts b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ratingbox{padding:12px 14px;margin:12px 0}
.ratingbox .scores{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.ratingbox .scores div b{font-family:var(--f-display);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.ratingbox .scores div span{color:var(--muted);font-size:13px;display:block}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.gallery button{aspect-ratio:1;padding:0;border:0;background:var(--sunk);border-radius:8px;overflow:hidden;max-width:100%}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.fav-moment{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-family:var(--f-display);font-style:italic;font-size:17px;margin:12px 0}

/* lightbox / picker */
.lb{position:fixed;inset:0;background:#0b0708;z-index:40;display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .x{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;color:#fff;background:rgba(255,255,255,.15)}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);color:#fff;background:rgba(255,255,255,.15)}
.lb .nv.l{left:8px}.lb .nv.r{right:8px}
.lb .cnt{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));color:#fff;font-size:13px;opacity:.8}
.picker .stage{flex:1;position:relative}
.cross{position:absolute;z-index:2;left:50%;top:50%;width:34px;height:42px;margin:-42px 0 0 -17px;pointer-events:none;color:var(--accent);filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.picker .search{position:absolute;left:12px;right:12px;top:10px;z-index:3}
.picker .readout{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;padding:10px 12px;text-align:center;font-size:14px}

/* onboarding / empty */
.center{min-height:100%;display:grid;place-items:center;padding:24px 16px;text-align:center}
.who{display:grid;gap:10px;max-width:320px;margin:16px auto 0}
.who .btn{font-size:18px;padding:16px}
.empty{max-width:340px;padding:16px;text-align:center}
.empty h3{font-family:var(--f-display);font-size:22px;margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;box-shadow:var(--shadow)}
.confirm{position:fixed;inset:0;background:rgba(10,4,6,.45);z-index:50;display:grid;place-items:center;padding:16px}
.confirm .card{padding:18px;max-width:340px;width:100%}
.confirm h4{margin:0 0 6px;font-family:var(--f-display);font-size:20px}
.busy{position:fixed;inset:0;background:rgba(10,4,6,.35);z-index:55;display:grid;place-items:center}
.busy .card{padding:16px 20px}
@media (max-width:380px){.tiles{grid-template-columns:repeat(2,1fr)}.facts{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.pin .b{transition:transform .15s}.pin:active .b{transform:scale(.94)}}
.login{max-width:340px;width:100%;text-align:left}
.login .f{margin-bottom:12px}
.err{color:var(--accent);font-size:13.5px;min-height:1.2em}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="grow">
      <div class="couple" id="coupleName">Spish <span class="h">♥</span> Ollie</div>
      <div class="since" id="sinceLine">Every place has a memory</div>
    </div>
    <button class="me-chip" id="meChip" type="button" hidden></button>
  </header>
  <main>
    <section class="view" id="v-map"><div class="map" id="mainMap"></div>
      <div class="map-float topf" id="otdWrap"></div>
      <div class="map-float bot" id="mapSummary"></div>
    </section>
    <section class="view" id="v-timeline" hidden><div class="pad" id="timeline"></div></section>
    <section class="view" id="v-miles" hidden><div class="pad" id="miles"></div></section>
    <section class="view" id="v-us" hidden><div class="pad" id="us"></div></section>
  </main>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button type="button" data-tab="map" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
    <button type="button" data-tab="timeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="6" cy="19" r="2"/><path d="M11 5h9M11 12h9M11 19h9"/></svg>Timeline</button>

/* ---------- helpers ---------- */

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const HEART='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 21s-8-5-8-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 2.8C20 16 12 21 12 21z"/></svg>';

const ICON={back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',

const MODES=[["car","🚗","Car",1.22],["train","🚆","Train",1.15],["plane","✈️","Plane",1.0],["bus","🚌","Bus/coach",1.25],["ferry","⛴️","Ferry",1.05],["walk","🚶","Walk",1.2],["bike","🚲","Bike",1.2]];
const CATS=[
 ["datenight","🌙","Date night",{cocktail:true,food:true,ph:"Friday date night"}],

 ["staycation","🏡","UK stay",{trip:true,stay:true,ph:"Lodge weekend in West Wales"}],

 ["milestone","❤️","Milestone",{home:true,ph:"Became official"}],
 ["other","✨","Something else",{ph:"Sunset walk"}]];
const CAT=Object.fromEntries(CATS.map(c=>[c[0],{icon:c[1],label:c[2],...c[3]}]));
const catOf=m=>m.category==="movie"?"nightin":m.category&&CAT[m.category]?m.category:m.kind==="trip"?"trip":m.kind==="milestone"?"milestone":"datenight";
const STAYS=["Lodge","Holiday home","Cottage","Hotel","B&B","Cabin","Glamping","Camping","Airbnb"];
const dishAvg=m=>{const v=(m.dishes||[]).map(d=>d.rating).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
const MODE=Object.fromEntries(MODES.map(m=>[m[0],{icon:m[1],label:m[2],f:m[3]}]));
const fmtDate=(d,o={day:"numeric",month:"short",year:"numeric"})=>{if(!d)return"";const [y,m,dd]=d.split("-").map(Number);return new Date(y,m-1,dd).toLocaleDateString("en-GB",o)};
const todayStr=()=>{const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`};
const addDays=(d,n)=>{const [y,m,dd]=d.split("-").map(Number);const t=new Date(y,m-1,dd+n);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`};
const hav=(a,b)=>{const R=3958.8,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLng=(b.lng-a.lng)*r;const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const legMiles=l=>l.miles!=null&&l.manual?Number(l.miles):(l.from&&l.to?Math.round(hav(l.from,l.to)*(MODE[l.mode]?.f||1.2)):0);
const memMiles=m=>(m.journeys||[]).reduce((s,l)=>s+legMiles(l),0);
const fmtN=n=>Math.round(n).toLocaleString("en-GB");
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function confirmBox(title,body,okLabel){return new Promise(res=>{const w=document.createElement("div");w.className="confirm";w.innerHTML=`<div class="card"><h4>${esc(title)}</h4><p class="muted">${esc(body)}</p><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost small" data-a="0">Cancel</button><button class="btn small" data-a="1">${esc(okLabel)}</button></div></div>`;w.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b||e.target===w){w.remove();res(b?.dataset.a==="1")}});document.body.appendChild(w)})}
function busy(msg){const w=document.createElement("div");w.className="busy";w.innerHTML=`<div class="card">${esc(msg)}</div>`;document.body.appendChild(w);return{set:m=>w.firstChild.textContent=m,done:()=>w.remove()}}

/* ---------- geography ---------- */
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const PLACES=(window.PLACES_DATA||[]).map(s=>{const p=s.split("|");return{n:p[0],lat:+p[1],lng:+p[2],r:p[3],pop:+(p[4]||0),local:p.length===4,k:norm(p[0])}});
function searchPlaces(q){const nq=norm(q);if(nq.length<2)return[];const out=[];for(const p of PLACES){let s=-1;if(p.k===nq)s=0;else if(p.k.startsWith(nq))s=1;else if(nq.length>=3&&(" "+p.k).includes(" "+nq))s=2;if(s<0)continue;out.push([s,p.local?0:1,-p.pop,p])}out.sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]);return out.slice(0,6).map(x=>x[3])}
function nearestPlace(lat,lng){let best=null,bd=1e9;const c=Math.cos(lat*Math.PI/180);for(const p of PLACES){const d=(p.lat-lat)**2+((p.lng-lng)*c)**2;if(d<bd&&(p.local||p.pop>15000||d<0.02)){bd=d;best=p}}return best}
// OpenStreetMap search for landmarks, venues and addresses (used only when you tap "Search maps")
async function searchOnline(q){const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=en-GB&q=${encodeURIComponent(q)}`);if(!r.ok)throw new Error("search failed");const j=await r.json();return j.map(x=>{const parts=x.display_name.split(",").map(t=>t.trim());return{name:x.name||parts[0],area:parts.slice(1).filter(t=>!/^\d/.test(t)).slice(0,2).concat(parts.slice(-1)).filter((v,i,a)=>a.indexOf(v)===i).join(", "),lat:+(+x.lat).toFixed(5),lng:+(+x.lon).toFixed(5)}})}

/* ---------- map view (Leaflet + OpenStreetMap) ---------- */
function MapView(el,{onPin,picker,onMove}={}){
  const dark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
  const m=L.map(el,{zoomControl:false,worldCopyJump:true,tap:true}).setView([52.4,-3.2],6);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(m);
  const pinLayer=L.layerGroup().addTo(m),routeLayer=L.layerGroup().addTo(m);
  const accent=()=>getComputedStyle(document.documentElement).getPropertyValue("--route").trim()||"#c7323e";
  m.on("move",()=>onMove&&onMove());
  const api={
    set(list,routes){
      pinLayer.clearLayers();routeLayer.clearLayers();
      const groups={};for(const it of list.filter(x=>x.lat!=null)){const k=it.lat.toFixed(4)+","+it.lng.toFixed(4);(groups[k]=groups[k]||[]).push(it)}
      for(const g of Object.values(groups)){g.sort((a,b)=>(b.date||"").localeCompare(a.date||""));const it=g[0];const img=g.find(x=>x.thumb)?.thumb;
        const html=`<div class="pin"><span class="t"></span><span class="b">${img?`<img src="${img}" alt="">`:`<span style="font-size:22px">${CAT[catOf(it)].icon}</span>`}</span>${g.length>1?`<span class="n">${g.length}</span>`:""}</div>`;
        const mk=L.marker([it.lat,it.lng],{icon:L.divIcon({className:"",html,iconSize:[46,54],iconAnchor:[23,54]}),title:it.title,keyboard:true,riseOnHover:true}).addTo(pinLayer);
        if(onPin)mk.on("click",()=>onPin(it,g.length>1?g:null))}
      for(const r of routes||[]){const a=[r.from.lat,r.from.lng],b=[r.to.lat,r.to.lng];
        L.polyline([a,b],{color:accent(),weight:3,opacity:.75,dashArray:r.mode==="plane"?"2 9":"7 8",lineCap:"round",interactive:false}).addTo(routeLayer);
        [a,b].forEach(p=>L.circleMarker(p,{radius:4,color:accent(),weight:2,fillColor:"#fff",fillOpacity:1,interactive:false}).addTo(routeLayer))}
    },
    fit(pts,anim){m.invalidateSize();if(!pts.length)return m.fitBounds([[50,-8.2],[58.7,1.8]],{animate:!!anim});m.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])),{padding:[70,70],maxZoom:pts.length===1?13:12,animate:!!anim})},
    center(){const c=m.getCenter();return{lat:c.lat,lng:c.lng}},
    goTo(lat,lng,z){m.invalidateSize();m.flyTo([lat,lng],z&&z<=19?z:15,{duration:.6})},
    zoomBy(f){f>1?m.zoomIn():m.zoomOut()},
    resize(){m.invalidateSize()}
  };
  new ResizeObserver(()=>{if(el.clientWidth)m.invalidateSize()}).observe(el);
  return api;
}

async function init(){
  renderAll();map.fit([]);
  if(!configured||!window.supabase){S.mode="demo";S.role="a";S.memories=DEMO.map(m=>({...m,example:true}));renderAll();map.fit(points(),false);return}
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange((ev)=>{if(ev==="PASSWORD_RECOVERY")setNewPassword();if(ev==="SIGNED_OUT")location.reload()});
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return showLogin();
  startLive(session.user);
}
function roleFromUser(u){const handle=(u.email||"").split("@")[0].toLowerCase();if(handle===(S.couple.nameA||"").toLowerCase()||handle==="spish")return"a";if(handle===(S.couple.nameB||"").toLowerCase()||handle==="ollie")return"b";return null}
async function startLive(u){
  S.uid=u.id;S.mode="live";renderHeader();
  await Promise.all([loadCouple(),loadMembers(),loadMemories()]);
  map.fit(points(),false);
  if(!S.role){const r=roleFromUser(u);if(r){await sb.from("mm_members").upsert({user_id:S.uid,who:r});S.role=r;renderAll()}else askWho()}
  sb.channel("memory-map")
    .on("postgres_changes",{event:"*",schema:"public",table:"mm_memories"},()=>loadMemories())
    .on("postgres_changes",{event:"*",schema:"public",table:"mm_couple"},()=>loadCouple())
    .on("postgres_changes",{event:"*",schema:"public",table:"mm_members"},()=>loadMembers())
    .on("postgres_changes",{event:"*",schema:"public",table:"mm_media"},()=>photoListeners.forEach(f=>f()))
    .subscribe();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){loadMemories();loadCouple()}});
}
async function loadMemories(){const {data,error}=await sb.from("mm_memories").select("id,doc");if(error)return err(error);S.memories=data.map(r=>({...r.doc,id:r.id}));renderAll()}
async function loadCouple(){const {data,error}=await sb.from("mm_couple").select("doc").eq("id",1).maybeSingle();if(error)return err(error);if(data)S.couple={...S.couple,...data.doc};renderHeader();if(S.tab==="us")renderUs()}
async function loadMembers(){const {data,error}=await sb.from("mm_members").select("user_id,who");if(error)return err(error);S.people={};(data||[]).forEach(r=>S.people[r.user_id]=r);S.role=S.people[S.uid]?.who||S.role;renderHeader()}
async function signedUrls(paths){const need=paths.filter(p=>!urlCache[p]);if(need.length){const {data}=await sb.storage.from("memory-map").createSignedUrls(need,60*60*12);(data||[]).forEach(d=>{if(d.signedUrl)urlCache[d.path]=d.signedUrl})}return paths.map(p=>urlCache[p])}
async function loadPhotos(mid){const {data,error}=await sb.from("mm_media").select("id,path,ord,kind").eq("memory_id",mid).order("ord");if(error){err(error);return[]}const urls=await signedUrls(data.map(d=>d.path));return data.map((d,i)=>({id:d.id,path:d.path,kind:d.kind||"photo",data:urls[i]}))}
function err(e){console.warn(e);toast(e?.message?"Couldn’t load: "+e.message:"Something went wrong. Try again.")}

function showLogin(){
  const p=openPage(`<div class="center"><form class="login" id="lf" novalidate>
    <div class="couple" style="font-size:34px;text-align:center">Spish <span class="h">♥</span> Ollie</div>
    <p class="muted" style="text-align:center;margin:6px 0 20px">Spish &amp; Ollie’s Memory Map</p>
    <div class="f"><label for="lu">Your name</label><input class="inp" id="lu" autocomplete="username" autocapitalize="none" placeholder="Spish or Ollie" required></div>
    <div class="f"><label for="lp">Password</label><input class="inp" id="lp" type="password" autocomplete="current-password" required></div>
    <div class="err" id="le" role="alert"></div>
    <button class="btn" style="width:100%" type="submit" id="lb">Log in</button>
  </form></div>`);
  $("#lf",p).addEventListener("submit",async e=>{e.preventDefault();const u=$("#lu",p).value.trim().toLowerCase(),pw=$("#lp",p).value;if(!u||!pw){$("#le",p).textContent="Enter your name and password.";return}
    const email=u.includes("@")?u:`${u}@${LOGIN_DOMAIN}`;$("#lb",p).disabled=true;$("#le",p).textContent="";
    const {data,error}=await sb.auth.signInWithPassword({email,password:pw});$("#lb",p).disabled=false;
    if(error){$("#le",p).textContent=error.message==="Invalid login credentials"?"That name and password don’t match. Check the spelling and try again.":error.message;return}
    p.remove();startLive(data.user)});
}
function setNewPassword(){
  const p=openPage(`<div class="center"><form class="login" id="nf"><h2 class="sec">Choose a new password</h2><div class="f"><label for="np">New password</label><input class="inp" id="np" type="password" autocomplete="new-password"></div><div class="err" id="ne"></div><button class="btn" style="width:100%" type="submit">Save password</button></form></div>`);
  $("#nf",p).addEventListener("submit",async e=>{e.preventDefault();const {error}=await sb.auth.updateUser({password:$("#np",p).value});if(error){$("#ne",p).textContent=error.message;return}p.remove();toast("Password changed")});

  let since="Every place has a memory";
  const daysSince=d=>{const [y,m,dd]=d.split("-").map(Number);return Math.max(0,Math.floor((Date.now()-new Date(y,m-1,dd))/864e5))};
  if(S.couple.since)since=`Together since ${fmtDate(S.couple.since,{day:"numeric",month:"long",year:"numeric"})} · ${fmtN(daysSince(S.couple.since))} days`;
  else if(S.couple.met)since=`First met ${fmtDate(S.couple.met,{day:"numeric",month:"long",year:"numeric"})} · ${fmtN(daysSince(S.couple.met))} days`;
  $("#sinceLine").textContent=since;

function renderMap(){
  const items=S.memories.filter(m=>m.place).map(m=>({...m,lat:m.place.lat,lng:m.place.lng}));
  const routes=S.memories.flatMap(m=>(m.journeys||[]).filter(l=>l.from&&l.to));
  map.set(items,routes);
  const total=S.memories.reduce((s,m)=>s+memMiles(m),0);
  $("#mapSummary").innerHTML=S.memories.length?`<div class="pill"><span><b>${S.memories.length}</b> ${S.memories.length===1?"memory":"memories"}</span><span class="muted">·</span><span><b>${fmtN(total)}</b> miles together</span></div>`:

function placeField(host,value,onChange,{label="Search a town or place",allowCustom=true}={}){
  let v=value;
  const draw=()=>{
    if(v){host.innerHTML=`<div class="placed"><span style="color:var(--accent)">${PINSVG.replace('width="34" height="42"','width="18" height="22"')}</span><span class="grow"><b>${esc(v.name)}</b><small>${esc(v.area||"")}</small></span><button type="button" class="btn ghost small" data-ch>Change</button></div>`;$("[data-ch]",host).onclick=()=>{const old=v;v=null;draw();const i=$("input",host);i.value=old.name;i.focus();onChange(null)};return}
    host.innerHTML=`<div class="pf"><input class="inp" placeholder="${esc(label)}" autocomplete="off"><div class="sugg" hidden></div></div>`;
    const inp=$("input",host),sg=$(".sugg",host);sg.addEventListener("pointerdown",e=>e.preventDefault());sg.addEventListener("mousedown",e=>e.preventDefault());
    const upd=()=>{const q=inp.value.trim();if(!q){sg.hidden=true;return}const rs=searchPlaces(q);
      sg.innerHTML=rs.map((p,i)=>`<button type="button" data-i="${i}">${esc(p.n)}<small>${esc(p.r)}</small></button>`).join("")+(allowCustom?`<button type="button" class="act" data-map>Pick “${esc(q)}” on the map</button>`:"")+(q.length>2&&S.mode==="live"?`<button type="button" class="act" data-web>Search maps for “${esc(q)}”</button>`:"");
      sg.hidden=false;
      $$("[data-i]",sg).forEach(b=>b.onclick=e=>{e.preventDefault();const p=rs[+b.dataset.i];set({name:p.n,area:p.r,lat:p.lat,lng:p.lng})});
      const mb=$("[data-map]",sg);if(mb)mb.onclick=e=>{e.preventDefault();openPicker(q,null,set)};
      const wb=$("[data-web]",sg);if(wb)wb.onclick=async e=>{e.preventDefault();wb.textContent="Searching…";try{const rs2=await searchOnline(q);sg.innerHTML=(rs2.length?rs2.map((r,i)=>`<button type="button" data-w="${i}">${esc(r.name)}<small>${esc(r.area)}</small></button>`).join(""):`<button type="button" disabled>No results for “${esc(q)}”</button>`)+(allowCustom?`<button type="button" class="act" data-map>Pick “${esc(q)}” on the map</button>`:"");$$("[data-w]",sg).forEach(b=>b.onclick=ev=>{ev.preventDefault();set(rs2[+b.dataset.w])});const mb2=$("[data-map]",sg);if(mb2)mb2.onclick=ev=>{ev.preventDefault();openPicker(q,null,set)}}catch(er){wb.textContent="Map search isn’t reachable. Pick it on the map instead."}};
    };
    inp.addEventListener("input",upd);inp.addEventListener("focus",upd);inp.addEventListener("blur",()=>setTimeout(()=>sg.hidden=true,200));
  };
  const set=x=>{v=x;draw();onChange(x)};
  draw();
  return{get:()=>v,set};
}

async function compress(file,maxSide,maxChars,q0=.84){
  let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file)})}
  const w0=bmp.width,h0=bmp.height;let side=maxSide,q=q0,out="";
  for(let tries=0;tries<8;tries++){const s=Math.min(1,side/Math.max(w0,h0));const c=document.createElement("canvas");c.width=Math.round(w0*s);c.height=Math.round(h0*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",q);if(out.length<=maxChars)break;if(q>.6)q-=.1;else side=Math.round(side*.8)}
  return out}
function videoPoster(file){return new Promise(res=>{const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";const url=URL.createObjectURL(file);let done=false;const fin=x=>{if(done)return;done=true;URL.revokeObjectURL(url);res(x)};
  v.onloadeddata=()=>{try{v.currentTime=Math.min(0.5,(v.duration||1)/2)}catch(e){fin("")}};
  v.onseeked=()=>{try{const s=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight));const c=document.createElement("canvas");c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);c.getContext("2d").drawImage(v,0,0,c.width,c.height);fin(c.toDataURL("image/jpeg",.75))}catch(e){fin("")}};
  v.onerror=()=>fin("");setTimeout(()=>fin(""),6000);v.src=url})}
async function makeThumb(dataUrl){const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=dataUrl});const S2=200,c=document.createElement("canvas");c.width=c.height=S2;const s=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,S2,S2);return c.toDataURL("image/jpeg",.72)}

  $("#mf",p).addEventListener("submit",e=>e.preventDefault());
  $("#fsave",p).onclick=async()=>{
    const ckName=$("#ckName",p).value.trim(),ckIng=$("#ckIng",p).value.trim(),C=CAT[f.category];
    if(f.category==="cocktail"&&!$("#ftitle",p).value.trim()&&ckName)$("#ftitle",p).value=ckName;
    const title=$("#ftitle",p).value.trim();if(!title){toast("Give it a title first");$("#ftitle",p).focus();return}
    const date=$("#fdate",p).value;if(!date){toast("Add the date");return}
    if(!C.home&&!f.place){toast("Pick where it was, so it can go on the map");return}
    const stayName=$("#stayName",p).value.trim();
    const doc={kind:f.kind,category:f.category,dishes:C.food?dishes.filter(d=>(d.name||"").trim()).map(d=>({name:d.name.trim(),who:d.who||"",rating:d.rating??null})):[],stay:C.stay&&(f.stay.type||stayName)?{type:f.stay.type||"",name:stayName}:null,cocktail:C.cocktail&&ckName?{name:ckName,ingredients:ckIng}:null,title,date,endDate:f.kind==="trip"?($("#fend",p).value||""):"",place:f.place||null,venue:C.home||C.stay?"":$("#fvenue",p).value.trim(),story:$("#fstory",p).value.trim(),favourite:$("#ffav",p).value.trim(),plannedBy:f.kind==="milestone"?"":f.plannedBy,
      journeys:legs.filter(l=>l.from&&l.to).map(l=>({date:l.date||date,from:l.from,to:l.to,mode:l.mode||"car",...(l.manual?{manual:true,miles:l.miles}:{})})),
      ratings:{...(m?.ratings||{})},photoCount:photos.length,updatedAt:new Date().toISOString(),updatedBy:S.role||"a"};
    if(rOn.checked)doc.ratings[S.role||"a"]=+rr.value;else delete doc.ratings[S.role||"a"];
    if(isNew){doc.createdAt=doc.updatedAt;doc.createdBy=S.role||"a"}
    doc.photoCount=photos.filter(x=>x.kind!=="video").length;doc.videoCount=photos.filter(x=>x.kind==="video").length;
    try{const f0=photos[0];doc.thumb=!f0?"":f0.id?(m?.thumb||""):f0.kind==="video"?(f0.poster?await makeThumb(f0.poster):""):await makeThumb(f0.data)}catch(e){doc.thumb=m?.thumb||""}
    if(S.mode==="demo"){if(isNew)S.memories.push({...doc,id:"ex"+Date.now(),example:true});else Object.assign(S.memories.find(x=>x.id===m.id),doc);p.remove();renderAll();toast("Saved for this preview only");return}
    const b=busy("Saving…");
    try{
      let mid=m?.id;
      if(!isNew){const {data:cur}=await sb.from("mm_memories").select("doc").eq("id",mid).maybeSingle();const keep=cur?.doc?.ratings||m.ratings||{};const mine=doc.ratings[S.role];doc.ratings={...keep};if(rOn.checked)doc.ratings[S.role]=mine;else delete doc.ratings[S.role];doc.createdAt=m.createdAt||doc.updatedAt;doc.createdBy=m.createdBy||doc.updatedBy;
        const {error}=await sb.from("mm_memories").update({doc,updated_at:new Date().toISOString()}).eq("id",mid);if(error)throw error}
      else{const {data,error}=await sb.from("mm_memories").insert({doc}).select("id").single();if(error)throw error;mid=data.id}
      if(removed.length){await sb.storage.from("memory-map").remove(removed.map(x=>x.path));await sb.from("mm_media").delete().in("id",removed.map(x=>x.id))}
      let n=0,total=photos.filter(x=>!x.id).length;
      for(const [i,ph] of photos.entries()){if(ph.id)continue;n++;b.set(`Uploading ${n} of ${total}${ph.kind==="video"?" (videos take a little longer)":""}…`);const isV=ph.kind==="video";const blob=isV?ph.file:await (await fetch(ph.data)).blob();const ext=isV?((ph.file.name.split(".").pop()||"mp4").toLowerCase()):"jpg";const path=`${mid}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
        const up=await sb.storage.from("memory-map").upload(path,blob,{contentType:isV?(ph.file.type||"video/mp4"):"image/jpeg"});if(up.error)throw up.error;const ins=await sb.from("mm_media").insert({memory_id:mid,path,ord:i,kind:isV?"video":"photo"});if(ins.error)throw ins.error}
      await loadMemories();
      b.done();p.remove();toast(isNew?"Memory saved":"Changes saved");
      if(isNew){setTab("map");if(doc.place)setTimeout(()=>map.goTo(doc.place.lat,doc.place.lng),300)}
    }catch(er){b.done();console.warn(er);toast("Couldn’t save: "+(er?.message||"check your connection and try again."))}
  };
}
window.openForm=openForm;window.openDetail=openDetail;window.askWho=askWho;window.renderTimeline=renderTimeline;
init();
</script>
